[project]
name = "readitforme"
version = "0.1.0"
description = "Chatbot local pour poser des questions à vos PDF"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "fastembed>=0.5",
    "chromadb>=1.0",
    "langchain>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-mistralai>=0.2",
]

[project.scripts]
readitforme = "readitforme.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["readitforme"]
